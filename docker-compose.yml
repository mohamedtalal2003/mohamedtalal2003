# SmartCity — local infrastructure for the walking skeleton.
# Start:  docker compose up -d      Check:  docker compose ps   (all should be "healthy")
# The .NET services run on the host with `dotnet run` during development (see CLAUDE.md).
# A later milestone adds Dockerfiles and an "apps" profile here.

name: smartcity

services:

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartcity}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartcity}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI  http://localhost:15672
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  emqx:
    image: emqx/emqx:5.8.6
    # DEV ONLY: anonymous connections allowed. mTLS + per-device ACLs come later (design record §6).
    ports:
      - "1883:1883"     # MQTT
      - "18083:18083"   # dashboard  http://localhost:18083  (admin / public)
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # console  http://localhost:9001
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/frames-temp &&
      mc mb --ignore-existing local/frames-permanent &&
      mc mb --ignore-existing local/evidence &&
      mc anonymous set download local/frames-temp &&
      mc anonymous set download local/frames-permanent &&
      mc anonymous set download local/evidence &&
      mc ilm rule add --expire-days 2 local/frames-temp || true &&
      echo 'buckets ready'"
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  seq:
    # Central structured logs. Follow one trace with the query:  CorrelationId = '<frame id>'
    image: datalust/seq:2024.3
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"     # ingestion
      - "8081:80"       # UI  http://localhost:8081
    volumes: [seqdata:/data]

volumes:
  pgdata:
  rabbitdata:
  miniodata:
  seqdata:
